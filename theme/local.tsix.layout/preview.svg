    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101926"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
    <linearGradient id="stream" x2="1" y2="1"><stop stop-color="#224e65"/><stop offset="1" stop-color="#142f43"/></linearGradient>
  </defs>
  <rect width="1280" height="680" rx="20" fill="url(#bg)"/>
