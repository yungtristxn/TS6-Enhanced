    <text x="48" y="116" fill="#edf3fa" font-size="42" font-weight="600">More stream. Less clutter.</text>
    <text x="48" y="151" fill="#94a5bb" font-size="19">Your channel stays close. Your stream gets the room.</text>
    <text x="48" y="204" fill="#c9d4e3" font-size="14" font-weight="600" letter-spacing="1">KEEP THE ROOM IN VIEW</text>
    <text x="704" y="204" fill="#c9d4e3" font-size="14" font-weight="600" letter-spacing="1">FOLD AWAY THE DISTRACTIONS</text>
