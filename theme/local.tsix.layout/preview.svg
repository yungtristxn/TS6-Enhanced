<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">TS6 Enhanced — more stream, less clutter</title>
  <desc id="desc">Concept illustration of a compact channel list beside focused streams. Toolbar controls hide and show the preview tray. Native navigation and chat are omitted from this conceptual illustration.</desc>
