<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS6 broadcast fixture</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/layout.css">
<style>
:root{--tsv-font-color:#e4e8f0;--tsv-shaded-bg:#202a3c;--tsv-header-bg:#172034;--tsv-tint:#298aff;--tsv-separation-border-color:#344158}
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;color:#e4e8f0;background:#111827}
.tsv-window{position:fixed;inset:0;display:flex;--tsix-navigator-width:320px;--tsix-messages-height:0px}
.sidebar-pane-layout{position:relative;width:96px;flex-shrink:0;height:100%;background:#182133}
.tsv-activity{position:relative;contain:strict;flex:1;min-width:0;display:flex;height:100%}
.main-pane-layout{position:relative;contain:strict;width:320px;flex-shrink:0;height:100%;background:#232e42}
.main-pane-layout>.tsv-header{height:44px;position:relative}.tsv-window-bar{height:44px;display:flex}
.tsv-central-toolbar{display:flex}.tsv-tool-buttons{display:flex}.tsv-tool-button{min-width:38px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fixtureFooter{position:absolute;bottom:0;left:0;right:0;height:64px;padding:24px 10px;background:#303b4c}
.ts-tree{position:absolute;top:180px;bottom:55px;left:0;right:0;padding:12px}.ts-server-status-bar{position:absolute;bottom:0;height:55px;width:100%;padding:12px;display:flex;gap:8px;background:#303b4c}
.main-pane-layout>.tsv-body>.tsv-item-view>.tsv-footer{position:absolute;bottom:0;width:100%}
.fixtureStage{position:relative;flex:1;min-width:0;background:#101929;padding:24px}.fixtureStage:fullscreen{width:100%;height:100%;background:#101929}.fixtureStage video{width:100%;height:calc(100% - 100px)}
.fixtureFriends{position:absolute;left:0;top:180px;bottom:119px;width:96px;z-index:4;background:#202a3c}
.ts-chat-input-container{position:absolute;bottom:8px;left:8px;right:8px;height:40px;display:flex;gap:8px;padding:4px;background:#303b4c;border-radius:6px}.ts-chat-input-container textarea{flex:1;min-width:0;resize:none}.ts-chat-input-container[hidden]{display:none}.fixtureStage:fullscreen .ts-chat-input-container{display:none}
</style></head><body>
<div class="tsv-window" data-tsix-navigator-view="channels"><aside class="sidebar-pane-layout"><div class="fixtureFooter">Your profile</div></aside><div class="tsv-activity">
<div class="main-pane-layout"><div class="tsv-header"><div class="tsv-window-bar"><div class="tsv-central-toolbar"><div class="tsv-central-toolbar-buttons tsv-tool-buttons"><div class="tsv-tool-button">Mic</div><div class="tsv-tool-button">Vol</div><div class="tsv-tool-button" id="nativeShare" title="Native sharing control">Pause</div></div></div></div></div>
<div class="tsv-body"><div class="tsv-item-view"><div class="ts-tree">Channels stay in place</div><div class="tsv-footer"><div class="ts-server-status-bar"><button>Create</button><button class="tsv-tool-button" id="startStream"><span class="tsv-icon-screenshare">Start Stream</span></button></div></div></div></div></div>
<div class="fixtureStage"><button id="fullscreen">Fullscreen</button><p>Own stream preview hidden</p><video></video><div class="ts-chat-input-container"><textarea aria-label="Chat draft">Keep my draft</textarea><button id="send">Send</button></div></div>
</div><aside class="fixtureFriends" hidden>Native Friends panel</aside></div>
<script>
const root=document.querySelector('.tsv-window'), watchers=new Set(), state={sessions:[],showOwn:false,actions:0}, clients=new Map();
const handler={id:1,FindClient:id=>clients.get(id)};
const options={computed:{allSessions(){return state.sessions}}}, button={contextMenuData:{component:{options}}};
document.querySelector('.tsv-central-toolbar').__vue__={screenshareButton:button};
const native=document.getElementById('nativeShare');native.__vue__={button};native.onclick=()=>state.actions++;
root.__vue__={$watch(get,callback){const w={get,callback,value:get()};watchers.add(w);return()=>watchers.delete(w)}};
const tick=()=>{for(const w of watchers){const next=w.get();if(next!==w.value){w.value=next;w.callback()}}};
const mutate=()=>{throw Error('Helper attempted to change native sharing state')};
function session(id,ids,paused=false){const data={paused,hidden:true,viewers:ids.map(clientId=>({clientId,scHandlerId:1}))};const value={id,isInbound:false,client:{sc_handler:handler},get viewers(){return data.viewers},get paused(){return data.paused},set paused(v){mutate()},get hidden(){return data.hidden},set hidden(v){mutate()},leave:mutate,setPaused:mutate};return {value,data}}
const originalVideo=document.querySelector('video');originalVideo.srcObject=new MediaStream();const originalMedia=originalVideo.srcObject;
window.lab={state,clients,handler,watchers,streams:[],tick,
 start(ids=[1,2]){this.streams=[session(1,ids)];state.sessions=this.streams.map(s=>s.value);tick()},
 stop(){this.streams=[];state.sessions=[];tick()},
 viewers(ids){this.streams[0].data.viewers=ids.map(clientId=>({clientId,scHandlerId:1}));tick()},
 pause(value){for(const s of this.streams)s.data.paused=value;tick()},
 add(ids,paused=false){this.streams.push(session(this.streams.length+1,ids,paused));state.sessions=this.streams.map(s=>s.value);tick()},
 report(){return {actions:state.actions,watchers:watchers.size,sameVideo:document.querySelector('video')===originalVideo,sameMedia:originalVideo.srcObject===originalMedia,hidden:this.streams.every(s=>s.data.hidden),showOwn:state.showOwn}},
 native,root
};
for(let i=1;i<=12;i++)clients.set(i,{displayName:i===1?'Alex Viewer':i===2?'Sam Friend':`Viewer ${i}`,avatarImage:null});
document.getElementById('fullscreen').onclick=()=>document.querySelector('.fixtureStage').requestFullscreen();
</script><script src="/streams-runtime.js"></script></body></html>
