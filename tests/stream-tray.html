.tsv-badge-count { position:absolute;right:0;top:-4px;font-size:12px;line-height:18px;color:#fff;background:#b32d38;pointer-events:none; }
.screenshare__global-hover-actions .tsv-icon { width:22px; height:22px; }
/* Incoming-control geometry from the supported native renderer. This fixture

.incoming .screen-overlay__bottom { padding:0 5px; justify-content:flex-start; }
.incoming .screen-overlay__bottom > .tsv-button { width:30px; flex:0 0 30px; }
.incoming .tsv-flex-grow { flex-grow:1; }
.incoming .tsv-icon { width:22px; height:22px; }
.always-visible-overlay { position:absolute; bottom:2px; left:5px; pointer-events:none; }
.screen-overlay__hero-actions__action-volume-wrapper { display:flex; flex-grow:10; max-width:102px; z-index:5; }
.screen-overlay__hero-actions__action-volume { display:flex; width:100%; transform:translateY(-1px); }
.screen-overlay__hero-actions__action-volume-slider { animation:hide-volume .09s forwards; min-width:0; opacity:0; }
.screen-overlay__hero-actions__action-volume-wrapper:hover .screen-overlay__hero-actions__action-volume-slider { animation:show-volume .09s forwards; }
@keyframes hide-volume { to { max-width:0;opacity:0;width:0; } }

.ts-slider { height:44px; min-width:40px; position:relative; width:100%; }
.ts-slider-track { position:absolute; top:50%; left:0; right:0; height:10px; transform:translateY(-50%); border-radius:3px; }
.ts-slider-track-fill { background:#58677a; }
.ts-slider-knob { position:absolute; top:calc(-50% + 2px); height:8px; width:0; transform:translate(-50%,-50%); z-index:10; }
.ts-slider-knob-svg { position:absolute; width:10px; height:20px; left:-5px; top:-3px; background:#dce2ed; border-radius:3px; pointer-events:none; }
.ts-slider-knob-bubble { position:absolute; min-width:50px; line-height:22px; padding:0 5px; left:50%; top:0; transform:translate(-50%,-100%); opacity:0; pointer-events:none; text-align:center; white-space:nowrap; background:#111722; }

<body class="tsv-window">

  const slider=bar.querySelector('.screen-overlay__hero-actions__action-volume-slider'),knob=bar.querySelector('.ts-slider-knob'),bubble=bar.querySelector('.ts-slider-knob-bubble');

  const move=e=>{const b=slider.getBoundingClientRect();setVolume(Math.max(0,Math.min(100,Math.round((e.clientX-b.x)/b.width*100))))};
  slider.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();dragging=true;bubble.classList.add('visible');move(e)});
  window.addEventListener('mousemove',e=>{if(dragging)move(e)});
  window.addEventListener('mouseup',e=>{if(dragging){move(e);dragging=false;bubble.classList.remove('visible')}});
  const mute=bar.querySelector('.tsv-button');mute.dataset.muted='false';
  mute.addEventListener('click',()=>{stream.__vue__.toggleMute?.();mute.dataset.muted=String(mute.dataset.muted!=='true');mute.querySelector('svg').setAttribute('name',mute.dataset.muted==='true'?'speaker-slash':'speaker');window.__tsixStreams?.sync()});

 const context=canvas.getContext('2d');context.fillStyle=['#24435a','#314a46','#453b59'][i];context.fillRect(0,0,960,540);

 const video=tile.querySelector('video');video.srcObject=canvas.captureStream(1);
 const player=tile.querySelector('.video-stream'),pvm=player.__vue__||{};pvm.session=session;session.isInbound=true;
 pvm.$emit=(name,s)=>{if(name==='enter-focus-mode')lab.focus(lab.focused===s?null:s);if(name==='toggle-fullscreen')player.requestFullscreen()};
 pvm.enterFocusModeAfterDelay=function(){if(this._dblClickTimeout){clearTimeout(this._dblClickTimeout);this._dblClickTimeout=null}else this._dblClickTimeout=setTimeout(()=>{this._dblClickTimeout=null;this.$emit('enter-focus-mode',this.session)},150)};
 pvm.toggleFullscreen=function(){if(this._dblClickTimeout){clearTimeout(this._dblClickTimeout);this._dblClickTimeout=null}this.$emit('toggle-fullscreen',this.session)};
 player.__vue__=pvm;
 player.addEventListener('click',event=>{event.stopPropagation();pvm.enterFocusModeAfterDelay(event)});
 player.addEventListener('dblclick',event=>{event.stopPropagation();pvm.toggleFullscreen(event)});
 if(new URLSearchParams(location.search).has('native-audio')) {
  navigator.createMediaStreamRequest=()=>{throw Error('The helper must not create native streams')};
 } else if(new URLSearchParams(location.search).has('volume-test')) {
  const audio=new AudioContext(),oscillator=audio.createOscillator(),gain=audio.createGain(),destination=audio.createMediaStreamDestination();
  gain.gain.value=.05;oscillator.connect(gain);gain.connect(destination);oscillator.start();
  video.srcObject.addTrack(destination.stream.getAudioTracks()[0]);
  (window.fixtureAudio ||= []).push(audio);
 }
 media.push({video,stream:video.srcObject});grid.append(tile);refs[session.uniqueIdentifier]=tile;
}
const watchers=new Set();
const vm=viewer.__vue__={

 showStreams:true,screenshareViewingSupported:true,isGridOpenedInPopup:false,isPopout:false,inDragStream:null,
 overrideSplitPercentage:-1,maxVideoAreaHeightPct:.66,maximumWidth:0,maximumHeight:0,maximumVideoHeight:0,gridPaddingY:6,resizeVideoHeightOrigin:-1,
 $refs:{fullArea:viewer.querySelector('.tsv-scroll-area-v')},
 $watch(get,cb){const entry={get,cb,value:get()};watchers.add(entry);return()=>watchers.delete(entry)},
 doUpdateGrid(){
  const w=this.maximumWidth-72,h=this.maximumVideoHeight;
  this.layoutStreams=this.allSessions.map((session,i)=>{
   const focused=lab.focused===session,side=lab.focused?this.allSessions.filter(s=>s!==lab.focused).indexOf(session):i;
   const single=this.allSessions.length===1;
   const availableHeight=single?h-12:focused?h*.70-12:lab.focused?h*.23-12:h-12;
   const width=Math.max(1,Math.min(single||focused?w-12:w/this.allSessions.length-12,availableHeight*16/9));
   const tile={item:{item:session,uniqueIdentifier:session.uniqueIdentifier},focused,x:single||focused?(w-width)/2:6+side*(w/this.allSessions.length),y:focused||!lab.focused||single?6:Math.floor(h*.70)+18,w:width,h:width*9/16};
   refs[session.uniqueIdentifier].style.cssText=`--grid-x:${tile.x}px;--grid-y:${tile.y}px;--grid-w:${tile.w}px;--grid-h:${tile.h}px`;
   return tile;
  });
  // Native automatic sizing uses the content bounds. The previous fixture
  // always filled the entire height budget and missed preview centering.
  this.gridHeight=this.overrideSplitPercentage===-1?Math.max(0,...this.layoutStreams.map(t=>t.y+t.h))+6:h;
  grid.style.height=`${this.gridHeight}px`;
  for(const entry of watchers){const next=entry.get();if(next!==entry.value){entry.value=next;entry.cb()}}
 }
};
const lab=window.lab={focused:sessions[0],vm,media,refs,watchers,
 focus(session){this.focused=session;vm.doUpdateGrid()},
 resize(){vm.maximumWidth=viewer.clientWidth;vm.maximumHeight=vm.$refs.fullArea.clientHeight;vm.maximumVideoHeight=vm.maximumHeight*(vm.overrideSplitPercentage===-1?.66:vm.overrideSplitPercentage);vm.doUpdateGrid()},
 remove(id){vm.allSessions=vm.allSessions.filter(s=>s.uniqueIdentifier!==id);refs[id].remove();if(this.focused?.uniqueIdentifier===id)this.focused=null;vm.doUpdateGrid()},
 report(){return {identity:media.every(({video,stream})=>video.srcObject===stream),watchers:watchers.size,split:vm.overrideSplitPercentage,tray:viewer.getAttribute('data-tsix-stream-tray'),draft:document.querySelector('input')?.value}}
};

if(new URLSearchParams(location.search).has('preview')){
 for(const tile of Object.values(refs)){
  const player=tile.querySelector('.video-stream');
  const children=[...player.childNodes],pvm=player.__vue__;
  pvm.session.status=0;pvm.session.isJoinable=true;pvm.joinCalls=0;
  pvm.onJoin=()=>{if(!pvm.session.isJoinable)return;pvm.joinCalls++;pvm.session.isJoinable=false;pvm.session.status=4;player.replaceChildren(...children);const video=player.querySelector('video');video?.play().catch(()=>{});video?.srcObject?.getVideoTracks().forEach(t=>t.requestFrame?.());lab.vm.doUpdateGrid();window.__tsixStreams?.sync()};
  player.innerHTML='<div class="stream-preview is-joinable" style="background:#0757c9"><div class="stream-preview__user-card" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>Available stream</span></div></div>';
  player.querySelector('.stream-preview').addEventListener('click',e=>{e.stopPropagation();pvm.onJoin()});

}
// Exercise beta5's public tile model without exposing legacy fields to the
// helper. The fixture's lab retains its own generator for the same scenarios.
{
 // Native beta5 has both a portal host and a display:contents context. The
 // original fixture omitted these and missed the single-preview overflow.
 const row=grid.parentElement.parentElement,portal=document.createElement('div'),context=document.createElement('div');

 row.replaceWith(portal);portal.append(context);context.append(row);
 for(const s of sessions)s.isInbound=true;
 for(const node of Object.values(refs))node.className='screen-tile-wrapper screen-tile-wrapper--video';
 const adapter={
  get flatTiles(){return vm.layoutStreams.map(t=>({tile:{id:t.item.uniqueIdentifier,payload:{kind:'video',session:t.item.item}},x:t.x,y:t.y,w:t.w,h:t.h})).concat(lab.extraTiles||[])},
  get sortableStreamsContainer(){return {sortedStreams:vm.allSessions}},
  isStreamVisible(s){return !s.hidden},
  isFocused(t){return lab.focused===t.payload.session},

  doUpdateGrid(){vm.doUpdateGrid()},
  $watch(get,cb){return vm.$watch(get,cb)}

}
</script>
