<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TS6 native shell fixture</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/layout.css">
<style>
:root{--tsv-font-color:#e4e8f0;--tsv-shaded-bg:#232d3f;--tsv-header-bg:#192335;--tsv-tint:#299aff;--tsv-tint2:#62b9ff;--tsv-separation-border-color:#3a4558;--tsv-font-size-small:13px;--tsv-header-window-bar-height:44px}
*{box-sizing:border-box}body{margin:0;font:15px 'Segoe UI',sans-serif;color:var(--tsv-font-color);background:#182233}button,input{font:inherit;color:inherit}button{cursor:pointer}.tsv-window{position:fixed;inset:0;display:flex}.sidebar-pane-layout{width:200px;display:flex;flex-direction:column;background:#232d3f}.tsv-title-bar,.tsv-bar,.tsv-tool-buttons,.tsv-central-toolbar{display:flex;align-items:center}.tsv-title-bar{height:44px}.tsv-search-input{width:100%;background:#182233}.sidebar-pane-layout>.tsv-body{flex:1}.tsv-footer .tsv-item{display:flex}.tsv-footer .tsv-bar-item{min-width:0}.tsv-footer .tsv-item-text{overflow:hidden}.tsv-activity{flex:1;display:flex;position:relative;contain:layout style paint}.main-pane-layout{width:320px;flex-shrink:0;position:relative;contain:layout style paint;display:flex;flex-direction:column}.main-pane-layout>.tsv-header{flex-shrink:0}.tsv-window-bar{height:44px}.main-pane-layout>.tsv-body{display:flex;flex:1;flex-direction:column}.ts-tree{flex:1;min-height:0;display:flex}.ts-server-tree-wrapper{flex:1;min-height:0}.ts-server-tree-scroller{height:100%;overflow:auto}.ts-server-tree-item-leaf{height:var(--ts-tree-client-height-compact);padding:5px 12px}.ts-server-header .tsv-view-banner{display:flex;align-items:center}.ts-server-status-bar{display:flex;align-items:center}.tsv-tool-button{display:flex;align-items:center;background:transparent;cursor:pointer}.tsv-tool-button-context-menu-toggle{display:flex;align-items:center}.tsv-icon{width:22px;height:22px}.tsv-central-toolbar{display:flex}.tsv-activity-secondary{flex:1;min-width:280px;background:#182233}.tsv-content-header-item{height:44px}.tsv-activity-secondary>.tsv-header{height:88px}.tsv-activity-secondary>.tsv-body{padding:20px}.tsv-resources-group{margin:12px 0}.tsv-resources-group button{display:block;margin:8px;padding:8px;background:#263449;border:0}.ts-audio-device-recovery{background:#273248}h6{margin:4px}.tsv-text-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div class="tsv-window tsv-window-scale-medium">
 <div class="sidebar-pane-layout"><div class="tsv-header"><div class="tsv-title-bar"><button aria-label="Notifications">Bell</button><span class="ts-title-logo">TeamSpeak</span></div><div class="tsv-bar"><input class="tsv-search-input" placeholder="Search / Connect"></div></div>
 <div class="tsv-body"><div class="tsv-resources-group" data-kind="activities"><div class="tsv-resize-area"><div class="tsv-activity-group"><svg name="server"></svg><button>Connected server</button></div><div class="tsv-activity-group"><svg name="chat-contact"></svg><button>Recent chat</button></div></div></div><div class="tsv-resources-group" data-kind="servers"><button>Bookmark</button></div><div class="tsv-resources-group" data-kind="matrix-contacts"><button>Friend</button></div><div class="tsv-resources-group" data-kind="matrix-rooms"><button>Group chat</button></div></div>
 <div class="tsv-footer"><div class="tsv-bar"><div class="tsv-bar-item"><div class="tsv-item"><div class="tsv-item-text">Alex Example</div></div></div><div class="tsv-bar-item"><svg name="settings" class="tsv-icon"></svg></div></div></div></div>
 <div class="tsv-activity"><div class="main-pane-layout"><div class="tsv-header"><div class="tsv-window-bar"><div class="tsv-central-toolbar"><div class="tsv-tool-buttons"><div class="tsv-tool-button" id="status"><div class="tsv-tool-button-icon-container"><svg name="away" class="tsv-icon"></svg></div></div></div><div class="tsv-tool-buttons tsv-central-toolbar-buttons"><div class="tsv-tool-button" id="mic"><div class="tsv-tool-button-icon-container"><svg name="microphone" class="tsv-icon"></svg></div></div><div class="tsv-tool-button" id="audio"><div class="tsv-tool-button-icon-container"><svg name="speaker" class="tsv-icon"></svg></div></div></div></div></div></div>
 <div class="tsv-body"><div class="ts-tree"><div class="ts-server-tree-wrapper"><div class="ts-server-tree-scroller" tabindex="0"><div><div class="ts-audio-device-recovery"><h6>Capture device not available</h6><div class="ts-audio-device-recovery-description">Choose a replacement device.</div><div class="ts-audio-device-selector"><button>Native device selector</button></div></div><div class="ts-server-header"><div class="tsv-view-banner">Community server</div></div></div><div id="rows"></div></div></div></div><div class="ts-server-status-bar"><button>Share</button><button>Server actions</button></div></div></div>
 <div class="tsv-activity-secondary tsv-activity-detail"><div class="tsv-header"><div class="tsv-window-bar"></div><div class="tsv-content-header-item">General</div></div><div class="tsv-body"><div class="ts-chat-container"><p>Native content stays available while navigation becomes a drawer.</p><div class="ts-chat-message-system-body compact" style="display:flex"><div class="ts-chat-message-system-body-contents">Alexandra joined the development discussion from another channel with a long descriptive name.</div><span class="ts-chat-message-system-time">16:45 · Today</span></div><input aria-label="Chat draft" value="Preserve my draft"></div></div></div>
</div>
<script>
const root=document.querySelector('.tsv-window'),nativeTree=document.querySelector('.ts-tree');let actions=0;
root.__vue__={collapsedSidebar:false,collapseSidebar(){},$watch(){return()=>{}},windowLayout:{isFull:true,sidebarIndex:0,mainIndex:1,windowSlots:[{size:200},{size:320},{size:0}],setSlotCollapsed(){},resizeSlotStarted(){},resizeSlot(){},resizeSlotEnded(){}}};
for(const n of document.querySelectorAll('[data-kind]'))n.__vue__={stack:{sections:[{key:n.dataset.kind}]}};
for(const [id,title] of [['mic','Toggle Microphone'],['audio','Toggle Speakers'],['status','Toggle Status']]){const n=document.getElementById(id);n.__vue__={button:{title}};n.addEventListener('click',()=>actions++)}
for(let i=0;i<45;i++){const n=document.createElement('div');n.className='ts-server-tree-item-leaf';n.textContent=`Channel ${i+1} and a long readable name`;document.getElementById('rows').append(n)}
window.lab={root,nativeTree,get actions(){return actions},preview(){const p=document.createElement('div');p.id='settings-preview';p.className='ts-appearance-settings';p.innerHTML='<div class="preview"><div class="ts-server-tree-wrapper"><div class="ts-server-header">Preview</div></div></div>';nativeTree.replaceWith(p)},server(){document.getElementById('settings-preview').replaceWith(nativeTree)}};
</script><script src="/workspace-runtime.js"></script></body></html>
